<div class="w-full text-field" [class.opacity-70]="effectiveDisabled()">
  @if (label()) {
    <label
      class="mb-1 flex items-center gap-2 text-sm text-[#3d4a5c]"
      [for]="id() || inputId"
    >
      @if (icon()) {
        <span class="flex h-4 w-4 items-center justify-center rounded-full bg-blue-200 text-blue-600">
          <lucide-icon [name]="icon()" [size]="12" aria-hidden="true"></lucide-icon>
        </span>
      }
      {{ label() }}
      @if (required()) {
        <span class="ml-0.5 font-bold text-[#c0392b]" aria-label="required">*</span>
      }
    </label>
  }

  @if (hint()) {
    <div [id]="hintId" class="mb-1.5 text-[13px] leading-snug text-[#5f6c7b]">
      {{ hint() }}
    </div>
  }

  <nz-input-group
    class="w-full"
    [ngClass]="wrapperClass()"
    [nzSize]="size()"
    [nzStatus]="ariaInvalid() ? 'error' : ''"
    [nzPrefix]="fieldIcon() ? inputIconTemplate : undefined"
    [nzSuffix]="showToggle() && type() === 'password' ? passwordToggle : undefined"
  >
    <input
      nz-input
      class="text-input"
      [ngClass]="inputClass()"
      [id]="id() || inputId"
      [type]="inputType()"
      [attr.name]="name() || null"
      [placeholder]="placeholder() || 'Enter value here'"
      [disabled]="effectiveDisabled()"
      [required]="required()"
      [ngModel]="value"
      [ngModelOptions]="{ standalone: true }"
      (ngModelChange)="onInputChange($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
    />
  </nz-input-group>

  <ng-template #inputIconTemplate>
    <lucide-icon
      [name]="fieldIcon()"
      [size]="18"
      class="text-gray-400 mr-2"
      aria-hidden="true"
    ></lucide-icon>
  </ng-template>

  <ng-template #passwordToggle>
    <button
      type="button"
      class="cursor-pointer text-gray-400 hover:text-gray-700"
      (click)="toggleVisibility()"
      [disabled]="effectiveDisabled()"
      [attr.aria-label]="isPasswordVisible() ? 'Hide password' : 'Show password'"
    >
      <lucide-icon
        [name]="isPasswordVisible() ? eyeOffIcon : eyeIcon"
        [size]="18"
        aria-hidden="true"
        class="text-gray-400"
      ></lucide-icon>
    </button>
  </ng-template>

  @if (errorMessage() && ariaInvalid()) {
    <div
      [id]="errorId"
      class="mt-1.5 flex items-center gap-1 text-[13px] leading-snug text-[#c0392b]"
      role="alert"
      aria-live="polite"
    >
      <lucide-icon class="h-3.5 w-3.5 shrink-0" [name]="errorIcon" [size]="14" aria-hidden="true"></lucide-icon>
      {{ errorMessage() }}
    </div>
  }
</div>
