@if (open) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-slate-900/40" (click)="onClose()"></div>
    <div class="relative w-full max-w-lg rounded-2xl bg-white p-6 shadow-[0_24px_60px_rgba(15,23,42,0.25)]">
      <div class="flex items-start justify-between gap-4">
        <div>
          <h3 class="text-lg font-semibold text-slate-900">Add student</h3>
          <p class="text-sm text-slate-500">Create a new student profile.</p>
        </div>
        <button
          type="button"
          class="rounded-full px-2 py-1 text-slate-500 hover:bg-slate-100"
          (click)="onClose()"
          aria-label="Close"
        >
          ✕
        </button>
      </div>

      <form class="mt-6 flex flex-col gap-4" [formGroup]="formGroup" (ngSubmit)="onSubmit()">
        <lib-text-field
          label="Full name"
          placeholder="Enter student name"
          formControlName="name"
          [ariaInvalid]="nameInvalid"
          [errorMessage]="nameError"
        ></lib-text-field>

        <lib-text-field
          label="Email"
          placeholder="Enter email address"
          type="email"
          formControlName="email"
          [ariaInvalid]="emailInvalid"
          [errorMessage]="emailError"
        ></lib-text-field>

        @if (errorMessage) {
          <app-form-error [message]="errorMessage"></app-form-error>
        }

        <div class="flex flex-wrap justify-end gap-3">
          <lib-button
            variant="outline"
            size="sm"
            [disabled]="submitting"
            (clicked)="onClose()"
          >
            Cancel
          </lib-button>
          <lib-button
            variant="primary"
            size="sm"
            type="submit"
            [loading]="submitting"
            [disabled]="submitting"
          >
            Create student
          </lib-button>
        </div>
      </form>
    </div>
  </div>
}
