<header class="flex h-[73px] items-center border-b border-slate-200 bg-white px-6 {{ headerClass() }}">
  <div class="flex w-full items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      @if (isMobile()) {
        <lib-button
          type="button"
          variant="unstyled"
          [fullWidth]="false"
          [className]="'inline-flex items-center justify-center rounded-md p-2 transition hover:bg-slate-100 ' + iconButtonClass()"
          (clicked)="onMenuClick()"
          aria-label="Open menu"
        >
          <lucide-icon [name]="icons.menu" [size]="20" aria-hidden="true"></lucide-icon>
        </lib-button>
      }

      <ng-content select="[top-nav-left]"></ng-content>

      @if (!isMobile()) {
        <div class="relative">
          <lib-text-field
            class="w-48 md:w-80 {{ inputClass() }}"
            [label]="''"
            name="search"
            [icon]="icons.search"
            [placeholder]="isMobile() ? 'Search...' : searchPlaceholder()"
            [ariaLabel]="'Search'"
            [(ngModel)]="searchValue"
            (ngModelChange)="onSearchInput($event)"
          ></lib-text-field>
        </div>
      }
    </div>

    <div class="flex items-center gap-2">
      <div class="relative">
        <lib-button
          type="button"
          variant="unstyled"
          [fullWidth]="false"
          className="relative flex items-center justify-center rounded-full p-2 hover:bg-slate-100"
          aria-label="Notifications"
        >
          <lucide-icon [name]="icons.bell" [size]="18" aria-hidden="true"></lucide-icon>
          @if (unreadCount() > 0) {
            <span
              class="absolute -right-1 -top-1 inline-flex h-5 min-w-[20px] items-center justify-center rounded-full bg-red-500 px-1 text-xs font-semibold text-white"
            >
              {{ unreadCount() }}
            </span>
          }
        </lib-button>
      </div>

      <div class="relative">
        <lib-button
          type="button"
          variant="unstyled"
          [fullWidth]="false"
          className="flex items-center gap-2 rounded-full bg-slate-50 px-3 py-2"
          (clicked)="toggleProfile()"
        >
          <span class="inline-flex h-8 w-8 items-center justify-center rounded-full bg-blue-100 text-blue-600">
            <lucide-icon [name]="icons.user" [size]="16" aria-hidden="true"></lucide-icon>
          </span>
          <div class="hidden flex-col text-left text-xs text-slate-600 md:flex">
            <span class="text-sm font-semibold text-slate-900">{{ user().name }}</span>
            <span>{{ user().role || 'Member' }}</span>
          </div>
        </lib-button>

        @if (showProfileDropdown) {
          <div class="absolute right-0 z-10 mt-2 w-64 rounded-2xl border border-slate-200 bg-white p-4 shadow-[0_16px_36px_rgba(15,23,42,0.15)]">
            <div class="flex items-center gap-3">
              <div class="flex h-10 w-10 items-center justify-center rounded-full bg-blue-100 text-blue-600">
                {{ user().initials }}
              </div>
              <div>
                <div class="text-sm font-semibold text-slate-900">{{ user().name }}</div>
                <div class="text-xs text-slate-500">{{ user().email }}</div>
              </div>
            </div>
            <div class="mt-3 text-xs text-slate-500">
              {{ user().institutionName || 'Institution' }}
            </div>
            <div class="mt-4 flex flex-col gap-2">
              <lib-button type="button" variant="subtle" (clicked)="navigateTo('/profile')">Profile</lib-button>
              <lib-button type="button" variant="subtle" (clicked)="navigateTo('/settings')">Settings</lib-button>
              <lib-button type="button" variant="danger" (clicked)="onLogout()">Log out</lib-button>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</header>
